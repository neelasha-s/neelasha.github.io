<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neelasha Sudarshan</title>
    <link rel="canonical" href="https://neelasha-s.github.io/">
    <!-- Sends visitors to the new site after 5 seconds. Delete this line to stay on this page. -->
    <meta http-equiv="refresh" content="5; url=https://neelasha-s.github.io/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Halant:wght@300;400&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #1F2937;
            color: white;
        }

        main {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 100px;
            padding: 40px 24px;
        }

        .headshot {
            height: 300px;
            width: auto;
            max-width: 100%;
            border: 5px solid #e0d7d7;
        }

        .message {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-align: center;
            max-width: 520px;
        }

        .title {
            font-family: "Halant", Georgia, serif;
            font-size: 48px;
            font-weight: 300;
            margin: 0;
        }

        .note {
            font-family: "Figtree", system-ui, sans-serif;
            font-size: 18px;
            color: #bababa;
            margin: 0;
        }

        .new-url {
            font-family: "Figtree", system-ui, sans-serif;
            font-size: 18px;
            font-weight: 500;
            color: #1F2937;
            background-color: #f2f2ee;
            border: 3px solid #4374b8;
            padding: 10px 22px;
            text-decoration: none;
            margin-top: 6px;
        }

        .new-url:hover,
        .new-url:focus-visible {
            background-color: #4374b8;
            color: white;
            outline: none;
        }

        .footer {
            height: 50px;
            background-color: #e6e6e1;
        }

        @media (max-width: 800px) {
            main {
                flex-direction: column;
                gap: 28px;
            }

            .headshot {
                height: auto;
                width: 200px;
            }

            .title {
                font-size: 38px;
            }

            .note,
            .new-url {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <main>
        <img class="headshot" src="assets/img-1.jpg" alt="image of Neelasha">
        <div class="message">
            <p class="title">Neelasha Sudarshan</p>
            <p class="note">This site has moved to a new address.</p>
            <a class="new-url" href="https://neelasha-s.github.io/">neelasha-s.github.io</a>
            <p class="note">You'll be taken there automatically in a few seconds.</p>
        </div>
    </main>
    <div class="footer"></div>
</body>
</html>
